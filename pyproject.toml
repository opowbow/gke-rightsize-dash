[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gke-rightsize-dash"
version = "1.0.0"
description = "Autonomous GKE Workload Rightsizing & Spot VM Advisory Agent built with Google ADK and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "GKE Rightsizing Team"}
]
keywords = [
    "gke",
    "kubernetes",
    "rightsizing",
    "finops",
    "vpa",
    "google-adk",
    "gemini",
    "vertex-ai",
    "spot-vms"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-adk>=0.3.0",
    "google-genai>=1.0.0",
    "google-cloud-monitoring>=2.15.0",
    "google-auth>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "starlette>=0.36.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
]

[project.scripts]
gke-rightsize = "main:main"
gke-rightsize-web = "gke_rightsize.web.app:run_dashboard"

[tool.setuptools.packages.find]
where = ["."]
include = ["gke_rightsize*"]
